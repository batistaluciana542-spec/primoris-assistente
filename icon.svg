<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">PRIMORIS</title>
<desc id="desc">Símbolo futurista do PRIMORIS formado por um P geométrico e anéis de energia.</desc>
<defs>
  <linearGradient id="bg" x1="70" y1="30" x2="450" y2="480" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070817"/>
    <stop offset=".48" stop-color="#160a30"/>
    <stop offset="1" stop-color="#050713"/>
  </linearGradient>
  <linearGradient id="prism" x1="116" y1="390" x2="405" y2="118" gradientUnits="userSpaceOnUse">
    <stop stop-color="#54e8ff"/>
    <stop offset=".48" stop-color="#8f63ff"/>
    <stop offset="1" stop-color="#ff4fd8"/>
  </linearGradient>
  <linearGradient id="shine" x1="160" y1="360" x2="360" y2="150" gradientUnits="userSpaceOnUse">
    <stop stop-color="#d9fbff"/>
    <stop offset=".5" stop-color="#54e8ff"/>
    <stop offset="1" stop-color="#ff8ce8"/>
  </linearGradient>
  <radialGradient id="core" cx="50%" cy="42%" r="65%">
    <stop stop-color="#54e8ff" stop-opacity=".32"/>
    <stop offset=".55" stop-color="#8d55ff" stop-opacity=".12"/>
    <stop offset="1" stop-color="#02030a" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<rect width="512" height="512" rx="116" fill="url(#bg)"/>
<circle cx="256" cy="256" r="190" fill="url(#core)"/>

<!-- energia externa -->
<circle cx="256" cy="256" r="178" fill="none" stroke="#54e8ff" stroke-width="2" opacity=".22"/>
<circle cx="256" cy="256" r="154" fill="none" stroke="url(#prism)" stroke-width="3" stroke-dasharray="8 20" opacity=".55"/>
<path d="M256 58v28M256 426v28M58 256h28M426 256h28" stroke="url(#prism)" stroke-width="5" stroke-linecap="round" opacity=".7"/>

<!-- brilho atrás do símbolo -->
<path d="M166 390V122h108c70 0 112 36 112 91 0 56-42 91-112 91h-50v86h-58Zm58-143h48c35 0 55-12 55-34 0-22-20-34-55-34h-48v68Z" fill="#54e8ff" opacity=".2" filter="url(#softGlow)"/>

<!-- símbolo P geométrico -->
<path d="M154 390V122h112c69 0 111 36 111 91 0 56-42 91-111 91h-55v86h-57Zm57-139h51c38 0 57-13 57-38 0-24-19-37-57-37h-51v75Z"
      fill="none" stroke="url(#prism)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>

<!-- núcleo -->
<path d="M211 251h51c38 0 57-13 57-38 0-24-19-37-57-37h-51v75Z" fill="url(#shine)" opacity=".96"/>
<path d="M154 390V122h18v250h84" fill="none" stroke="#eaffff" stroke-width="4" opacity=".72" stroke-linecap="round"/>

<!-- cortes digitais -->
<path d="M116 174h22M374 338h22M128 354h18M366 158h18" stroke="#54e8ff" stroke-width="4" stroke-linecap="round" opacity=".65"/>
<circle cx="128" cy="174" r="4" fill="#ff4fd8" filter="url(#glow)"/>
<circle cx="384" cy="338" r="4" fill="#54e8ff" filter="url(#glow)"/>
</svg>