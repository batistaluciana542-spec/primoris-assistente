<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
<title id="title">ORION</title>
<defs>
  <linearGradient id="bg" x1="70" y1="40" x2="440" y2="470" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050713"/><stop offset=".5" stop-color="#16072f"/><stop offset="1" stop-color="#030711"/>
  </linearGradient>
  <radialGradient id="orb" cx="42%" cy="35%" r="68%">
    <stop stop-color="#ffffff"/><stop offset=".07" stop-color="#bfffff"/>
    <stop offset=".18" stop-color="#54e8ff"/><stop offset=".38" stop-color="#4968ff"/>
    <stop offset=".62" stop-color="#a23cff"/><stop offset=".82" stop-color="#25054e"/><stop offset="1" stop-color="#05030e"/>
  </radialGradient>
  <linearGradient id="ring" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
    <stop stop-color="#54e8ff"/><stop offset=".48" stop-color="#7864ff"/><stop offset="1" stop-color="#ff4fd8"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
</defs>

<rect width="512" height="512" rx="116" fill="url(#bg)"/>

<!-- halo de energia -->
<circle cx="256" cy="256" r="184" fill="none" stroke="#54e8ff" stroke-width="2" opacity=".16"/>
<circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="4" stroke-dasharray="10 18" opacity=".65"/>
<circle cx="256" cy="256" r="139" fill="none" stroke="#8f63ff" stroke-width="2" stroke-dasharray="3 15" opacity=".5"/>

<!-- energia difusa -->
<circle cx="256" cy="256" r="112" fill="#8b4dff" opacity=".22" filter="url(#soft)"/>

<!-- núcleo ORION -->
<circle cx="256" cy="256" r="91" fill="url(#orb)" stroke="#54e8ff" stroke-width="4" filter="url(#glow)"/>
<circle cx="256" cy="256" r="63" fill="none" stroke="#ffffff" stroke-width="2" opacity=".3"/>
<circle cx="256" cy="256" r="27" fill="#02030a" opacity=".92"/>
<circle cx="246" cy="245" r="9" fill="#fff" opacity=".95" filter="url(#glow)"/>

<!-- órbitas -->
<ellipse cx="256" cy="256" rx="204" ry="72" fill="none" stroke="url(#ring)" stroke-width="3" opacity=".42" transform="rotate(-24 256 256)"/>
<ellipse cx="256" cy="256" rx="204" ry="72" fill="none" stroke="#54e8ff" stroke-width="2" opacity=".25" transform="rotate(34 256 256)"/>

<!-- pontos de energia -->
<circle cx="83" cy="177" r="5" fill="#54e8ff" filter="url(#glow)"/>
<circle cx="427" cy="335" r="5" fill="#ff4fd8" filter="url(#glow)"/>
<circle cx="391" cy="119" r="3" fill="#9a6cff"/>
<circle cx="121" cy="396" r="3" fill="#54e8ff"/>

<!-- quatro marcas de orientação -->
<path d="M256 48v30M256 434v30M48 256h30M434 256h30" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" opacity=".72"/>
</svg>